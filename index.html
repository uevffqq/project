<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Исторический квест: Романовы в Екатеринбурге</title>
    <!-- Подключаем стили для карты -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
        h1 { text-align: center; color: #333; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        #map { height: 600px; width: 100%; max-width: 1000px; margin: 0 auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .info-box { max-width: 1000px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <h1>🗺️ Исторический квест «По следам Романовых»</h1>
    <p class="subtitle">Интерактивная карта мест посещения в Екатеринбурге</p>

    <!-- Контейнер для карты -->
    <div id="map"></div>

    <div class="info-box">
        <h3>Как пользоваться картой:</h3>
        <p>Нажми на любую метку на карте, чтобы узнать историческую справку и задание для квеста.</p>
    </div>

    <!-- Подключаем скрипт карты -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Инициализация карты (центр — Екатеринбург)
        var map = L.map('map').setView([56.8389, 60.6057], 12);

        // 2. Добавление слоя карты (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 3. Добавление меток (точек квеста)
        // Координаты: [Широта, Долгота]
        
        // Точка 1: Храм-на-Крови
        L.marker([56.8443, 60.6088]).addTo(map)
            .bindPopup('<b>Храм-на-Крови</b><br>Место, где стоял Дом Ипатьева. Здесь трагически оборвалась жизнь царской семьи.<br><br><b>Задание:</b> Найдите памятник последним Романовым. Какое слово высечено на постаменте?');

        // Точка 2: Духовно-просветительский центр «Царский»
        L.marker([56.8438, 60.6110]).addTo(map)
            .bindPopup('<b>Центр «Царский»</b><br>Здесь находится музей Царской семьи с уникальными документами и вещами.<br><br><b>Задание:</b> Какая реликвия семьи Романовых хранится в музее?');

        // Точка 3: Храм Вознесения Господня
        L.marker([56.8420, 60.6050]).addTo(map)
            .bindPopup('<b>Храм Вознесения Господня</b><br>Старейшая церковь города. Колокольный звон был слышен узникам Дома Ипатьева.<br><br><b>Задание:</b> В каком году был основан этот храм?');

        // Точка 4: Уральский театр оперы и балета
        L.marker([56.8330, 60.5950]).addTo(map)
            .bindPopup('<b>Театр оперы и балета</b><br>Здание построено к 300-летию дома Романовых. Здесь объявили об отречении Николая II.<br><br><b>Задание:</b> Кто был архитектором этого здания?');

        // Точка 5: Ганина Яма
        L.marker([56.9258, 60.4738]).addTo(map)
            .bindPopup('<b>Ганина Яма</b><br>Монастырь Святых Царственных Страстотерпцев. Место, куда initially были сброшены тела.<br><br><b>Задание:</b> Сколько дней длилось паломничество к этому месту в 1990-е годы?');

    </script>
</body>
</html>
