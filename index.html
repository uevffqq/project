<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Путеводитель: Романовы в Екатеринбурге</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
        h1 { text-align: center; color: #333; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        #map { height: 600px; width: 100%; max-width: 1000px; margin: 0 auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .info-box { max-width: 1000px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        /* Стили для попапа */
        .leaflet-popup-content {
            width: 280px !important;
        }
        .leaflet-popup-content img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .leaflet-popup-content b {
            display: block;
            margin-bottom: 5px;
            color: #8B0000;
            font-size: 15px;
        }
        .leaflet-popup-content p {
            margin: 5px 0;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>🗺️ Интерактивный путеводитель «Романовы в Екатеринбурге»</h1>
    <p class="subtitle">Карта мест, связанных с пребыванием царской семьи в 1918 году</p>

    <div id="map"></div>

    <div class="info-box">
        <h3>Как пользоваться картой:</h3>
        <p>Нажми на любую метку на карте, чтобы увидеть фотографию, историческую справку и точный адрес. Всего в путеводителе 9 локаций.</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([56.8389, 60.6057], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 1. Храм-на-Крови
        L.marker([56.8443, 60.6088]).addTo(map)
            .bindPopup('<img src="krest.jpg" alt="Храм-на-Крови"><b>Храм-на-Крови</b><p>Адрес: ул. Царская, 10</p><p>Построен на месте Дома Ипатьева, где в ночь с 16 на 17 июля 1918 года была расстреляна царская семья.</p>');

        // 2. Центр «Царский»
        L.marker([56.8438, 60.6110]).addTo(map)
            .bindPopup('<img src="tsarsky.jpg" alt="Центр Царский"><b>Центр «Царский»</b><p>Адрес: ул. Царская, 8</p><p>Музей Царской семьи с уникальными документами, фотографиями и личными вещами Романовых.</p>');

        // 3. Храм Вознесения Господня
        L.marker([56.8420, 60.6050]).addTo(map)
            .bindPopup('<img src="voznesenie.jpg" alt="Храм Вознесения"><b>Храм Вознесения Господня</b><p>Адрес: ул. Клары Цеткин, 3</p><p>Одна из старейших церквей Екатеринбурга. Колокольный звон был слышен узникам Дома Ипатьева.</p>');

        // 4. Театр оперы и балета
        L.marker([56.8330, 60.5950]).addTo(map)
            .bindPopup('<img src="opera.jpg" alt="Театр оперы и балета"><b>Театр оперы и балета</b><p>Адрес: пр. Ленина, 46А</p><p>Построен к 300-летию дома Романовых. Здесь горожанам объявили об отречении Николая II.</p>');

        // 5. Ганина Яма
        L.marker([56.9258, 60.4738]).addTo(map)
            .bindPopup('<img src="ganina.jpg" alt="Ганина Яма"><b>Ганина Яма</b><p>Адрес: пос. Шувакиш</p><p>Монастырь Святых Царственных Страстотерпцев. Место, куда изначально были сброшены тела.</p>');

        // 6. Мемориал в Поросёнковом логу
        L.marker([56.9265, 60.4755]).addTo(map)
            .bindPopup('<img src="porosenkov.jpg" alt="Мемориал"><b>Мемориал в Поросёнковом логу</b><p>Адрес: пос. Шувакиш</p><p>Место, где в 1990-е годы были обнаружены останки членов царской семьи.</p>');

        // 7. Часовня св. Елисаветы Феодоровны
        L.marker([56.8440, 60.6095]).addTo(map)
            .bindPopup('<img src="chasovnya.jpg" alt="Часовня"><b>Часовня св. Елисаветы</b><p>Адрес: ул. Царская, 10б</p><p>Первый мемориальный храм на месте «Екатеринбургской голгофы», освящён в 1992 году.</p>');

        // 8. Музей истории Екатеринбурга
        L.marker([56.8395, 60.6055]).addTo(map)
            .bindPopup('<img src="museum.jpg" alt="Музей истории"><b>Музей истории Екатеринбурга</b><p>Адрес: ул. Карла Либкнехта, 26</p><p>Экспозиция о быте горожан и пребывании Романовых в Екатеринбурге.</p>');

        // 9. Зал памяти Романовых (Музей истории и археологии Урала)
        L.marker([56.8393, 60.5945]).addTo(map)
            .bindPopup('<img src="romanov_hall.jpg" alt="Зал памяти Романовых"><b>Зал памяти Романовых</b><p>Адрес: пр. Ленина, 69/10</p><p>Постоянная экспозиция, посвящённая семье Николая II: подлинные вещи из Дома Ипатьева и оружие цареубийц.</p>');

    </script>
</body>
</html>
