<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Исторический квест: Романовы в Екатеринбурге</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
        h1 { text-align: center; color: #333; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        #map { height: 600px; width: 100%; max-width: 1000px; margin: 0 auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .info-box { max-width: 1000px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <h1>🗺️ Исторический квест «По следам Романовых»</h1>
    <p class="subtitle">Интерактивная карта мест посещения в Екатеринбурге</p>

    <div id="map"></div>

    <div class="info-box">
        <h3>Как пользоваться картой:</h3>
        <p>Нажми на любую метку на карте, чтобы узнать историческую справку и задание для квеста. Всего в маршруте 8 точек.</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Инициализация карты (центр — Екатеринбург)
        var map = L.map('map').setView([56.8389, 60.6057], 12);

        // 2. Добавление слоя карты
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 3. Добавление меток
        
        // Точка 1: Храм-на-Крови
        L.marker([56.8443, 60.6088]).addTo(map)
            .bindPopup('<b>1. Храм-на-Крови</b><br>Место, где стоял Дом Ипатьева.<br><br><b>Задание:</b> Найдите памятник последним Романовым. Какое слово высечено на постаменте?');

        // Точка 2: Центр «Царский»
        L.marker([56.8438, 60.6110]).addTo(map)
            .bindPopup('<b>2. Центр «Царский»</b><br>Музей Царской семьи с уникальными документами и вещами.<br><br><b>Задание:</b> Какая реликвия семьи Романовых хранится в музее?');

        // Точка 3: Храм Вознесения Господня
        L.marker([56.8420, 60.6050]).addTo(map)
            .bindPopup('<b>3. Храм Вознесения Господня</b><br>Старейшая церковь города. Колокольный звон был слышен узникам Дома Ипатьева.<br><br><b>Задание:</b> В каком году был основан этот храм?');

        // Точка 4: Театр оперы и балета
        L.marker([56.8330, 60.5950]).addTo(map)
            .bindPopup('<b>4. Театр оперы и балета</b><br>Здание построено к 300-летию дома Романовых. Здесь объявили об отречении Николая II.<br><br><b>Задание:</b> Кто был архитектором этого здания?');

        // Точка 5: Ганина Яма
        L.marker([56.9258, 60.4738]).addTo(map)
            .bindPopup('<b>5. Ганина Яма</b><br>Монастырь Святых Царственных Страстотерпцев. Место, куда initially были сброшены тела.<br><br><b>Задание:</b> Сколько дней длилось паломничество к этому месту в 1990-е годы?');

        // Точка 6: Мемориал в Поросёнковом логу
        L.marker([56.9265, 60.4755]).addTo(map)
            .bindPopup('<b>6. Мемориал в Поросёнковом логу</b><br>Место, где в 1990-е годы были обнаружены останки членов царской семьи.<br><br><b>Задание:</b> В каком году были найдены останки?');

        // Точка 7: Часовня св. Елисаветы Феодоровны
        L.marker([56.8440, 60.6095]).addTo(map)
            .bindPopup('<b>7. Часовня св. Елисаветы Феодоровны</b><br>Деревянная часовня, где молились о царственных страстотерпцах.<br><br><b>Задание:</b> Кто такая Елисавета Феодоровна?');

        // Точка 8: Музей истории Екатеринбурга
        L.marker([56.8395, 60.6055]).addTo(map)
            .bindPopup('<b>8. Музей истории Екатеринбурга</b><br>Здесь можно узнать больше о быте горожан и пребывании Романовых в городе.<br><br><b>Задание:</b> Найдите экспонат, связанный с царской семьёй.');

    </script>
</body>
</html>
